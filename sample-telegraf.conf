# Configuration for telegraf agent 
# current version of telegraf 1.35.3
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false
  debug = true
  logfile = "/var/log/telegraf/telegraf-yeo.log"
  logfile_rotation_max_size = "100MB"
  logfile_rotation_max_archives = 3

[[outputs.influxdb_v2]]
  urls = ["http://128.40.193.25:8086"]
  token = "$INFLUX_TOKEN"
  organization = "UCL-CE"
  bucket = "CE_yeo"

# --- MQTT CONSUMERS FOR NEW TOPIC STRUCTURE ---

# 1. Detection Messages
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt.cetools.org:1883"]
  topics = ["yeo/acoupi/+/detection"]
  data_format = "json_v2"

  # Extract device_id from the topic: yeo/acoupi/<device_id>/detection
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "yeo/acoupi/+/detection"
    tags = "_/_/device_id/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "acoupi_detections"

    # --- Standard (Wi-Fi) Format ---
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "detections"
      optional = true
      disable_prepend_keys = true
      tags = ["label"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        label = "tags.0.tag.value"
        confidence = "detection_score"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "recording.created_on"
      rename = "time_str"
      optional = true

    # --- Compacted (Cellular) Format ---
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "d"
      optional = true
      disable_prepend_keys = true
      tags = ["s"]
      included_keys = ["c"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        confidence = "c"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "t"
      rename = "time_unix"
      type = "int"
      optional = true

# 2. Heartbeat Messages
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt.cetools.org:1883"]
  topics = ["yeo/acoupi/+/heartbeat"]
  data_format = "json_v2"

  # Extract device_id from the topic: yeo/acoupi/<device_id>/heartbeat
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "yeo/acoupi/+/heartbeat"
    tags = "_/_/device_id/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "acoupi_heartbeat"

    # --- Standard (Wi-Fi) Heartbeat ---
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      optional = true
      included_keys = ["device_id", "status"]
      tags = ["device_id"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        status = "status"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sent_on"
      rename = "time_str"
      optional = true

    # --- Compacted (Cellular) Heartbeat ---
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "h"
      optional = true
      [inputs.mqtt_consumer.json_v2.object.fields]
        cpu = "cpu"
        shm = "shm"
        mem_free = "mem_free"
        mem_used = "mem_used"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "t"
      rename = "time_unix"
      type = "int"
      optional = true

# 3. Deployment Messages
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt.cetools.org:1883"]
  topics = ["yeo/acoupi/+/deployment"]
  data_format = "json_v2"

  # Extract device_id from the topic: yeo/acoupi/<device_id>/deployment
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "yeo/acoupi/+/deployment"
    tags = "_/_/device_id/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "acoupi_deployment"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s.n"
      rename = "name"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s.v"
      rename = "version"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s.l.0"
      rename = "latitude"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "s.l.1"
      rename = "longitude"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "t"
      rename = "time_unix"
      type = "int"


# -------------------------------------------------------------
# DYNAMIC TIMESTAMP PARSING
# -------------------------------------------------------------
[[processors.starlark]]
  namepass = ["acoupi_detections", "acoupi_heartbeat", "acoupi_deployment"]
  source = '''
load("time.star", "time")

def apply(metric):
    # 1. Compacted Unix Timestamp (Cellular & Deployment)
    if "time_unix" in metric.fields:
        ts = int(metric.fields["time_unix"])
        metric.time = ts * 1000000000  # convert to nanoseconds
        metric.fields.pop("time_unix")

    # 2. Standard ISO-8601 Timestamp (Wi-Fi)
    elif "time_str" in metric.fields:
        t_val = time.parse_time(metric.fields["time_str"])
        metric.time = t_val.unix_nano()
        metric.fields.pop("time_str")

    return metric
'''
